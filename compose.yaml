services:
  rdxdownloader:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      RDX_DATA_DIR: /tmp/rdxdownloader
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=4g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
