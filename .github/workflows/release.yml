name: Package release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_project.py
      - name: Create source ZIP
        run: git archive --format=zip --prefix=RdxDownloader/ -o RdxDownloader-${{ github.ref_name }}.zip HEAD
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "RdxDownloader-${GITHUB_REF_NAME}.zip" --generate-notes
